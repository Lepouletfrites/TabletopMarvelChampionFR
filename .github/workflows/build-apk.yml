name: Build Android APK

on:
  push:
    branches:
      - main # Si ta branche s'appelle master, change 'main' en 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Node.js & Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Files & Sync Capacitor
        run: |
          # On regroupe tes fichiers web dans un dossier 'www'
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' ./ www/
          
          # On crée le fichier de configuration Capacitor
          echo '{
            "appId": "com.marveldeckbuilder.app",
            "appName": "Marvel Champions",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          # On génère Android
          npx cap add android
          npx cap sync android

      - name: Patch Gradle Version (Fix BouncyCastle Bug)
        run: |
          cd android
          # 1. Forcer l'utilisation de Gradle 8.7 (corrige le bug de décompression)
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          
          # 2. Désactiver la compilation parallèle et allouer de la mémoire
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
