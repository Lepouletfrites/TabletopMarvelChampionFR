name: Build Android APK

on:
  push:
    branches:
      - main # Si ta branche s'appelle master, change 'main' en 'master'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # <-- CORRECTION : Le moteur standard pour Android
          java-version: '17'      # <-- Retour à 17 (le plus stable pour Capacitor)

      - name: Initialize Node.js & Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Files & Sync Capacitor
        run: |
          # On regroupe tes fichiers web dans un dossier 'www'
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' ./ www/
          
          # On crée le fichier de configuration Capacitor
          echo '{
            "appId": "com.marveldeckbuilder.app",
            "appName": "Marvel Champions",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          # On génère Android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # Ajout de 'clean' et '--no-build-cache' pour éviter que Gradle s'emmêle les pinceaux
          ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
